# Workspaces and the single version catalog (conventions §6).
# Every dependency version lives here; package.json files use "catalog:".
packages:
  - apps/*
  - packages/*

# Fail install on the wrong Node.js or pnpm version (package.json "engines").
engineStrict: true

# Supply chain (conventions §6): a version is installed only after it has been public for two
# weeks (minutes), so a hijacked release is usually found and pulled first. pnpm checks new
# resolutions only; versions already in the lockfile are not re-checked. Dependabot's
# `cooldown` (.github/dependabot.yml) waits the same 14 days: change both together.
minimumReleaseAge: 20160

# Exact versions that are inside the window but needed now. Remove each line on its date.
# A security patch inside the window gets its own line with a reason and a date.
minimumReleaseAgeExclude:
  # unrs-resolver 1.13.0 (eslint-import-resolver-typescript) platform binaries, released
  # 2026-10-31; any `pnpm add` re-resolves them. Remove after 2026-11-14.
  - "@unrs/resolver-binding-android-arm-eabi@1.13.0"
  - "@unrs/resolver-binding-android-arm64@1.13.0"
  - "@unrs/resolver-binding-darwin-arm64@1.13.0"
  - "@unrs/resolver-binding-darwin-x64@1.13.0"
  - "@unrs/resolver-binding-freebsd-x64@1.13.0"
  - "@unrs/resolver-binding-linux-arm-gnueabihf@1.13.0"
  - "@unrs/resolver-binding-linux-arm-musleabihf@1.13.0"
  - "@unrs/resolver-binding-linux-arm64-gnu@1.13.0"
  - "@unrs/resolver-binding-linux-arm64-musl@1.13.0"
  - "@unrs/resolver-binding-linux-loong64-gnu@1.13.0"
  - "@unrs/resolver-binding-linux-loong64-musl@1.13.0"
  - "@unrs/resolver-binding-linux-ppc64-gnu@1.13.0"
  - "@unrs/resolver-binding-linux-riscv64-gnu@1.13.0"
  - "@unrs/resolver-binding-linux-riscv64-musl@1.13.0"
  - "@unrs/resolver-binding-linux-s390x-gnu@1.13.0"
  - "@unrs/resolver-binding-linux-x64-gnu@1.13.0"
  - "@unrs/resolver-binding-linux-x64-musl@1.13.0"
  - "@unrs/resolver-binding-openharmony-arm64@1.13.0"
  - "@unrs/resolver-binding-win32-arm64-msvc@1.13.0"
  - "@unrs/resolver-binding-win32-ia32-msvc@1.13.0"
  - "@unrs/resolver-binding-win32-x64-msvc@1.13.0"
  # commitlint 21.2.4 dependency, released 2026-11-01. Remove after 2026-11-15.
  - conventional-commits-parser@7.1.4
  # Vitest 5.1.0 for Phase 1a (phase-1-agent-core, tooling upgrades), released 2026-10-29 to
  # 2026-11-02. Remove after 2026-11-16.
  - vitest@5.1.0
  - "@vitest/coverage-v8@5.1.0"
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"
  - "@vitest/istanbul-lib-coverage@2.1.0"
  - "@vitest/istanbul-lib-report@2.1.0"
  # MSW 3.0.4 for Phase 1a adapter fixtures (phase-1-agent-core D-2), released 2026-11-06.
  # Remove after 2026-11-20.
  - msw@3.0.4
  # typescript-eslint 8.72.2 (already locked), re-resolved when Phase 1a's test packages are
  # added, released 2026-11-09. Remove after 2026-11-23.
  - "@typescript-eslint/utils@8.72.2"
  # eslint 10.14.0 (already locked), re-resolved when packages/core lists it as a direct
  # dependency, released 2026-10-30. Remove after 2026-11-13.
  - eslint@10.14.0
  # eslint dependencies (already locked), re-resolved with it: @types/estree 1.0.10, released
  # 2026-10-29 (remove after 2026-11-12), and @eslint-community/regexpp 4.12.3, released
  # 2026-11-08 (remove after 2026-11-22). Without these lines the install moves them back to
  # older versions (KP-04).
  - "@types/estree@1.0.10"
  - "@eslint-community/regexpp@4.12.3"
  # Security patch: vite 8.3.7 fixes GHSA-p4f5-76q4-ffq7 (critical: code execution through an
  # exposed dev server; affects 8.3.0 to 8.3.6). The fix is in Rolldown 1.2.18, which vite
  # 8.3.7 requires. All released 2026-11-09. Remove after 2026-11-23.
  - vite@8.3.7
  - rolldown@1.2.18
  - "@rolldown/binding-android-arm-eabi@1.2.18"
  - "@rolldown/binding-android-arm64@1.2.18"
  - "@rolldown/binding-darwin-arm64@1.2.18"
  - "@rolldown/binding-darwin-x64@1.2.18"
  - "@rolldown/binding-freebsd-x64@1.2.18"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.18"
  - "@rolldown/binding-linux-arm64-gnu@1.2.18"
  - "@rolldown/binding-linux-arm64-musl@1.2.18"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.18"
  - "@rolldown/binding-linux-s390x-gnu@1.2.18"
  - "@rolldown/binding-linux-x64-gnu@1.2.18"
  - "@rolldown/binding-linux-x64-musl@1.2.18"
  - "@rolldown/binding-openharmony-arm64@1.2.18"
  - "@rolldown/binding-win32-arm64-msvc@1.2.18"
  - "@rolldown/binding-win32-x64-msvc@1.2.18"

# pnpm 10 blocks dependency install scripts by default.
# Allow one only with a reason, e.g.:
# onlyBuiltDependencies:
#   - esbuild # native binary used by the production bundle

catalog:
  # Pinned exactly: adapters are reviewed on every SDK upgrade (conventions §15.11, plan P-1).
  # 1.3.0 sends API version 2026-10-21.
  "@anthropic-ai/sdk": 1.3.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@eslint/js": ^10.0.1
  # Node.js 24 types match the runtime in .nvmrc; Node 26 is a separate change (phase-1 plan).
  "@types/node": ^24.19.2
  "@vitest/coverage-v8": ^5.1.0
  dependency-cruiser: ^18.7.2
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-import-x: ^4.18.1
  eslint-plugin-turbo: ^2.11.10
  globals: ^17.14.0
  msw: ^3.0.4
  prettier: ^3.6.2
  turbo: ^2.5.6
  # TypeScript 7 waits for typescript-eslint support (it supports < 6.1 today).
  typescript: ^6.0.3
  typescript-eslint: ^8.72.2
  # Vitest 5 runs on Vite and declares it a required peer; listed here so its version is chosen
  # in this file, not by peer resolution. 8.3.7 is the first 8.3 release with the fix for
  # GHSA-p4f5-76q4-ffq7; it is inside the release-age window, so it has an exclusion above.
  vite: ^8.3.7
  vitest: ^5.1.0
  zod: ^4.6.7
