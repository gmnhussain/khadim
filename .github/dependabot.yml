# Weekly dependency updates (conventions §6).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Dhaka
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Dhaka
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Dhaka
    commit-message:
      prefix: chore
      include: scope
